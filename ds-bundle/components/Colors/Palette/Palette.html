<!-- @dsCard group="Colors" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../styles.css">
  <style>
    body { margin: 0; padding: 40px; background: var(--creme); }
    #root { max-width: 1100px; margin: 0 auto; }
    .rm-doc-kicker { font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--ouro); margin: 0 0 10px; }
    .rm-doc-title { font-family: var(--serif); font-weight: 300; font-size: 40px; line-height: 1.05; color: var(--navy); margin: 0 0 8px; }
    .rm-doc-rule { width: 54px; height: 1px; background: var(--ouro); border: 0; margin: 0 0 32px; }
    .rm-note { font-family: var(--sans); font-size: 13px; line-height: 1.6; color: var(--medio); }
  </style>
</head><body>
  <div id="root">
    <p class="rm-doc-kicker">05 — Palette</p>
    <h1 class="rm-doc-title">Colour</h1>
    <hr class="rm-doc-rule">
    
    <p style="font-family:var(--sans);font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--ouro);margin:0 0 16px">Core</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:24px">
  <figure style="margin:0">
    <div style="height:104px;border-radius:6px;border:1px solid var(--ouro-palido);background:#14243E"></div>
    <figcaption style="padding-top:10px">
      <div style="font-family:var(--sans);font-weight:500;font-size:14px;color:var(--navy)">Navy Reiners</div>
      <div style="font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--medio);margin-top:2px">#14243E · --navy</div>
      <div style="font-family:var(--sans);font-size:12px;line-height:1.5;color:var(--medio);margin-top:6px">Institutional base. Dark grounds, titles on light.</div>
    </figcaption>
  </figure>
  <figure style="margin:0">
    <div style="height:104px;border-radius:6px;border:1px solid var(--ouro-palido);background:#9A7B35"></div>
    <figcaption style="padding-top:10px">
      <div style="font-family:var(--sans);font-weight:500;font-size:14px;color:var(--navy)">Ouro</div>
      <div style="font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--medio);margin-top:2px">#9A7B35 · --ouro</div>
      <div style="font-family:var(--sans);font-size:12px;line-height:1.5;color:var(--medio);margin-top:6px">Primary accent. Details, icons, rules, italics.</div>
    </figcaption>
  </figure>
  <figure style="margin:0">
    <div style="height:104px;border-radius:6px;border:1px solid var(--ouro-palido);background:#FAF7F2"></div>
    <figcaption style="padding-top:10px">
      <div style="font-family:var(--sans);font-weight:500;font-size:14px;color:var(--navy)">Creme</div>
      <div style="font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--medio);margin-top:2px">#FAF7F2 · --creme</div>
      <div style="font-family:var(--sans);font-size:12px;line-height:1.5;color:var(--medio);margin-top:6px">Dominant light ground (60% of usage).</div>
    </figcaption>
  </figure>
  <figure style="margin:0">
    <div style="height:104px;border-radius:6px;border:1px solid var(--ouro-palido);background:#1A1510"></div>
    <figcaption style="padding-top:10px">
      <div style="font-family:var(--sans);font-weight:500;font-size:14px;color:var(--navy)">Tinta</div>
      <div style="font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--medio);margin-top:2px">#1A1510 · --tinta</div>
      <div style="font-family:var(--sans);font-size:12px;line-height:1.5;color:var(--medio);margin-top:6px">Body text on light; near-black footers.</div>
    </figcaption>
  </figure></div>
    <p style="font-family:var(--sans);font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--ouro);margin:36px 0 16px">Support</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:24px">
  <figure style="margin:0">
    <div style="height:104px;border-radius:6px;border:1px solid var(--ouro-palido);background:#2C4A72"></div>
    <figcaption style="padding-top:10px">
      <div style="font-family:var(--sans);font-weight:500;font-size:14px;color:var(--navy)">Aço</div>
      <div style="font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--medio);margin-top:2px">#2C4A72 · --aco</div>
      <div style="font-family:var(--sans);font-size:12px;line-height:1.5;color:var(--medio);margin-top:6px">Cool Navy variant — secondary contrast.</div>
    </figcaption>
  </figure>
  <figure style="margin:0">
    <div style="height:104px;border-radius:6px;border:1px solid var(--ouro-palido);background:#C4A15A"></div>
    <figcaption style="padding-top:10px">
      <div style="font-family:var(--sans);font-weight:500;font-size:14px;color:var(--navy)">Ouro Claro</div>
      <div style="font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--medio);margin-top:2px">#C4A15A · --ouro-claro</div>
      <div style="font-family:var(--sans);font-size:12px;line-height:1.5;color:var(--medio);margin-top:6px">Gold on dark grounds (Navy / Tinta).</div>
    </figcaption>
  </figure>
  <figure style="margin:0">
    <div style="height:104px;border-radius:6px;border:1px solid var(--ouro-palido);background:#E8D9B5"></div>
    <figcaption style="padding-top:10px">
      <div style="font-family:var(--sans);font-weight:500;font-size:14px;color:var(--navy)">Ouro Pálido</div>
      <div style="font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--medio);margin-top:2px">#E8D9B5 · --ouro-palido</div>
      <div style="font-family:var(--sans);font-size:12px;line-height:1.5;color:var(--medio);margin-top:6px">Hairline rules, secondary text on Navy.</div>
    </figcaption>
  </figure>
  <figure style="margin:0">
    <div style="height:104px;border-radius:6px;border:1px solid var(--ouro-palido);background:#F0EBE1"></div>
    <figcaption style="padding-top:10px">
      <div style="font-family:var(--sans);font-weight:500;font-size:14px;color:var(--navy)">Pergaminho</div>
      <div style="font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--medio);margin-top:2px">#F0EBE1 · --pergaminho</div>
      <div style="font-family:var(--sans);font-size:12px;line-height:1.5;color:var(--medio);margin-top:6px">Alternate light ground for section rhythm.</div>
    </figcaption>
  </figure>
  <figure style="margin:0">
    <div style="height:104px;border-radius:6px;border:1px solid var(--ouro-palido);background:#5E5549"></div>
    <figcaption style="padding-top:10px">
      <div style="font-family:var(--sans);font-weight:500;font-size:14px;color:var(--navy)">Médio</div>
      <div style="font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--medio);margin-top:2px">#5E5549 · --medio</div>
      <div style="font-family:var(--sans);font-size:12px;line-height:1.5;color:var(--medio);margin-top:6px">Warm grey — secondary body text.</div>
    </figcaption>
  </figure>
  <figure style="margin:0">
    <div style="height:104px;border-radius:6px;border:1px solid var(--ouro-palido);background:#9E9287"></div>
    <figcaption style="padding-top:10px">
      <div style="font-family:var(--sans);font-weight:500;font-size:14px;color:var(--navy)">Claro</div>
      <div style="font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--medio);margin-top:2px">#9E9287 · --claro</div>
      <div style="font-family:var(--sans);font-size:12px;line-height:1.5;color:var(--medio);margin-top:6px">Softer warm grey — metadata, tertiary text.</div>
    </figcaption>
  </figure></div>
    <div style="display:flex;height:44px;border-radius:6px;overflow:hidden;margin:36px 0 10px;border:1px solid var(--ouro-palido)">
      <div style="flex:60;background:var(--creme)"></div>
      <div style="flex:28;background:var(--navy)"></div>
      <div style="flex:12;background:var(--ouro)"></div>
    </div>
    <p class="rm-note"><strong style="color:var(--navy);font-weight:500">Composition 60 / 28 / 12</strong> — Creme · Navy · Ouro. Gold is accent only: never a large fill (section, card, or primary-button background). No colour outside this palette is permitted.</p>
  
  </div>
</body></html>
