<!-- @dsCard group="Icons" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../../../styles.css">
  <style>
    body { margin: 0; padding: 40px; background: var(--creme); }
    #root { max-width: 1100px; margin: 0 auto; }
    .rm-doc-kicker { font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--ouro); margin: 0 0 10px; }
    .rm-doc-title { font-family: var(--serif); font-weight: 300; font-size: 40px; line-height: 1.05; color: var(--navy); margin: 0 0 8px; }
    .rm-doc-rule { width: 54px; height: 1px; background: var(--ouro); border: 0; margin: 0 0 32px; }
    .rm-note { font-family: var(--sans); font-size: 13px; line-height: 1.6; color: var(--medio); }
  </style>
</head><body>
  <div id="root">
    <p class="rm-doc-kicker">09 — Icon system</p>
    <h1 class="rm-doc-title">Icons</h1>
    <hr class="rm-doc-rule">
    
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:28px">
      
  <figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:12px">
    <div style="width:88px;height:88px;display:flex;align-items:center;justify-content:center;background:var(--creme);border:1px solid var(--ouro-palido);border-radius:6px;color:var(--ouro)">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.25"/></svg>
    </div>
    <figcaption style="font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--medio)">Estratégia</figcaption>
  </figure>
      
  <figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:12px">
    <div style="width:88px;height:88px;display:flex;align-items:center;justify-content:center;background:var(--creme);border:1px solid var(--ouro-palido);border-radius:6px;color:var(--ouro)">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 16 0"/><path d="M7 12a5 5 0 0 1 10 0"/><path d="M10.5 12a1.5 1.5 0 0 1 3 0"/></svg>
    </div>
    <figcaption style="font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--medio)">Presença</figcaption>
  </figure>
      
  <figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:12px">
    <div style="width:88px;height:88px;display:flex;align-items:center;justify-content:center;background:var(--creme);border:1px solid var(--ouro-palido);border-radius:6px;color:var(--ouro)">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0"/><path d="M12 17v3"/><path d="M9 20h6"/></svg>
    </div>
    <figcaption style="font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--medio)">Voz</figcaption>
  </figure>
      
  <figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:12px">
    <div style="width:88px;height:88px;display:flex;align-items:center;justify-content:center;background:var(--creme);border:1px solid var(--ouro-palido);border-radius:6px;color:var(--ouro)">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/><path d="M9 11.5l2 2 4-4"/></svg>
    </div>
    <figcaption style="font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--medio)">Reputação</figcaption>
  </figure>
      
  <figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:12px">
    <div style="width:88px;height:88px;display:flex;align-items:center;justify-content:center;background:var(--creme);border:1px solid var(--ouro-palido);border-radius:6px;color:var(--ouro)">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 8a8 8 0 1 0 1 5"/><path d="M20 3v5h-5"/></svg>
    </div>
    <figcaption style="font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--medio)">Recorrência</figcaption>
  </figure>
      
  <figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:12px">
    <div style="width:88px;height:88px;display:flex;align-items:center;justify-content:center;background:var(--creme);border:1px solid var(--ouro-palido);border-radius:6px;color:var(--ouro)">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V6l7-3v18"/><path d="M11 21V9l7 3v9"/><path d="M4 21h16"/><path d="M7 9v0M7 13v0M7 17v0"/></svg>
    </div>
    <figcaption style="font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--medio)">In Company</figcaption>
  </figure>
    </div>
    <p class="rm-note" style="margin-top:32px">Linear, <strong style="color:var(--navy);font-weight:500">1.5px stroke</strong>, single-colour, 24×24 grid, rounded caps/joins. Ouro on light grounds, Ouro Claro on dark. Never filled, multicolour, or shadowed. Serene geometry — soft curves predominate.</p>
  
  </div>
</body></html>
